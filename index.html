<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Simple Cardiac Coherence</title>
<meta name="description" content="Cohérence cardiaque guidée : un cercle bleu clair grandit et se réduit selon 3 rythmes de respiration recommandés." />
<meta name="theme-color" content="#05070c" />
<meta name="color-scheme" content="dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Cohérence" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<main class="app">
  <header class="header">
    <button type="button" class="title-toggle" id="titleToggle" aria-expanded="false">
      <span class="app-name" id="appName">Simple Cardiac Coherence</span><span class="info-icon" aria-hidden="true">?</span>
    </button>
  </header>

  <section class="stage" id="stage">
    <div class="glow" aria-hidden="true"></div>
    <div class="max-ring" aria-hidden="true"></div>
    <button class="circle" id="circle" type="button" aria-label="Démarrer ou mettre en pause la séance">
      <span class="circle-label" id="circleLabel" aria-hidden="true">START</span>
    </button>
    <div class="info-panel" id="infoPanel"></div>
  </section>

  <section class="bottom-ui">
    <div class="time-row">
      <span class="time-elapsed" id="timeElapsed">0:00</span>
      <span class="phase-label" id="phaseLabel" role="button" tabindex="0">Prêt</span>
      <span class="time-remaining" id="timeRemaining">5:00</span>
    </div>
    <div class="progress-track" aria-hidden="true">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="mode-name" id="modeName"></div>
    <nav class="mode-switch" id="modeSwitch" role="tablist" aria-label="Choisir un mode de respiration"></nav>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
